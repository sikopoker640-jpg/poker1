name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        run: |
          Z=$(find . -iname "*.zip" | head -1)
          if [ -n "$Z" ]; then
            echo "Found zip: $Z"
            mkdir -p unzipped
            unzip -o "$Z" -d unzipped
          fi
          S=$(find . -name settings.gradle.kts | head -1)
          if [ -z "$S" ]; then
            echo "NO PROJECT FOUND. Files in repo:"
            find . -not -path "./.git/*" | head -60
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: |
          DIR=$(dirname "$(find . -name settings.gradle.kts | head -1)")
          cd "$DIR"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GameCleaner-apk
          path: "**/build/outputs/apk/debug/*.apk"
